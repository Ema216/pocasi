<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pocasi</title>
    <link rel="icon" type="image/png" href="source/cloudy.png">

    
</head>
<body style="margin: 0; padding: 0; height: 100vh; width: 100vw; display: flex; justify-content: center; align-items: center; overflow: hidden;">
    <img src="source\7551270494_357467774f_o.webp" alt="Obrázek počasí" height="100%" width="100%" style="border: none;">
    <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: flex; flex-direction: column; justify-content: center; align-items: flex-start; text-align: left;">
        <h1 style="color: white; font-size: clamp(4rem, 10vw, 15rem); font-family: Arial, sans-serif; margin: 0; line-height: 0.9;">Počasí Přerov</h1>
        <div style="display: flex; align-items: center; gap: 20px; margin-top: 40px;">
            <div style="color: rgba(255, 255, 255, 0.75); font-size: clamp(3rem, 6vw, 8rem); font-family: Arial, sans-serif; line-height: 1;">
                <span id="teplota" aria-live="polite">...</span>
            </div>
            <div style="color: rgba(255, 255, 255, 0.75); font-size: clamp(2rem, 4vw, 5rem); font-family: Arial, sans-serif; line-height: 1;">°C</div>
        </div>
    </div>
    <button onclick="window.location.href='https://www.youtube.com/watch?v=dQw4w9WgXcQ&list=RDdQw4w9WgXcQ&start_radio=1'"style="position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%); padding: 20px 20px; font-size: 1.5rem; background-color: rgba(255, 255, 255, 0.2); color: white; border: none; border-radius: 5px; cursor: pointer;" onclick="window.location.href='index.html'">přejít na počasí</button>

    <script>
        async function nactiPocasi() {
            const url = "https://api.open-meteo.com/v1/forecast?latitude=49.4551&longitude=17.4509&current=temperature_2m&timezone=auto";

            try {
                const odpoved = await fetch(url);

                if (!odpoved.ok) {
                    throw new Error("Chyba při načítání dat");
                }

                const data = await odpoved.json();
                const teplota = data.current?.temperature_2m;
                const element = document.getElementById("teplota");

                if (element) {
                    element.textContent = teplota !== undefined ? teplota.toFixed(1) : "...";
                }
            } catch (error) {
                console.error(error);
                const element = document.getElementById("teplota");

                if (element) {
                    element.textContent = "N/A";
                }
            }
        }

        nactiPocasi();
    </script>
 
</body>
</html>
